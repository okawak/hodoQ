name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Performance tests (release, serial)
        run: cargo test --release --lib --all-features performance_ -- --ignored --test-threads=1 --nocapture
      - name: Release build
        run: cargo build --release
