name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep main runs alive so they can populate the cache shared by future PRs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  # Keep backtrace line numbers without caching full type/variable debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          runner-image: ${{ matrix.os }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features

  performance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          runner-image: ${{ matrix.os }}
      - name: Performance tests (release, serial)
        run: cargo test --locked --release --lib --test integration --all-features performance_ -- --ignored --test-threads=1 --nocapture

  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          runner-image: ${{ matrix.os }}
      - name: Release build
        run: cargo build --locked --release
      - name: Package and verify macOS app
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Verify Windows application icon
        if: runner.os == 'Windows'
        run: ./scripts/verify-windows-icon.ps1
