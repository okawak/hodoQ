name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep main runs alive so they can populate the cache shared by future PRs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      # Keep backtrace line numbers without caching full type/variable debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"
      - name: Format
        run: cargo fmt --check
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Also separate runner images; rust-cache keys on rustc, host, flags and Cargo.lock.
          key: ${{ matrix.os }}
          cache-bin: "false"
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Performance tests (release, serial)
        run: cargo test --locked --release --lib --all-features performance_ -- --ignored --test-threads=1 --nocapture
      - name: Release build
        run: cargo build --locked --release
